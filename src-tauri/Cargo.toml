[package]
name = "goatstare-vpn-app"
version = "0.1.0"
description = "GoatStare VPN desktop manager"
authors = ["goatstare"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "goatstare_vpn_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2"
keyring = "3"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Credentials"] }
tauri-plugin-playwright = "0.4.1"
defguard_wireguard_rs = "0.11"
wireguard-nt = "0.5"

[dev-dependencies]
mockito = "1"

[features]
e2e-testing = []
