[package]
name = "blink-vpn-app"
version = "0.1.0"
description = "Blink VPN desktop manager"
authors = ["blink"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "blink_vpn_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# `tray-icon`: closing the window hides the app to the notification area (see lib.rs).
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
# Closing hides the window rather than exiting, so a Start-menu relaunch would otherwise start a
# second process against the same SQLite database, with a second tray icon. This plugin makes the
# relaunch focus the existing window instead. Official Tauri plugin, maintained with Tauri itself.
# The alternative, a hand-rolled named mutex plus a window-message handshake to raise the first
# instance, re-implements exactly what this crate does.
tauri-plugin-single-instance = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security_Credentials",
  # Interface byte counters, so throughput stays visible without elevation. `wg show` needs
  # administrator; these are ordinary interface statistics any user can read.
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
] }
# Key generation only. The interface runtime from this crate, and the `wireguard-nt` driver
# bindings that went with it, were removed — see backend/wireguard/mod.rs for why. Tunnels are
# managed through the WireGuard for Windows service.
defguard_wireguard_rs = "0.11"
# AWS request signing for the EC2 adapter, and nothing else.
#
# Deliberately *not* `aws-sdk-ec2`: that crate is async-only, and every command in this app runs on
# the blocking pool because `reqwest::blocking` builds its own runtime (see commands/system.rs).
# Driving an async SDK from there reintroduces exactly the "cannot drop a runtime" panic that once
# killed the whole IPC channel. Signing, by contrast, is pure computation — it composes with the
# existing blocking client and pulls no runtime of its own.
#
# Hand-rolling SigV4 over `hmac`/`sha2` was the alternative. Rejected because a signing mistake
# surfaces only as an opaque 403 with no indication of which part of the canonical request is wrong.
aws-sigv4 = "1.3.6"
# Supplies the `Credentials` type that `aws-sigv4`'s signing params require. Not a separate design
# decision — it is how the crate above takes a key pair.
aws-credential-types = "1.2.10"
# Google service-account authentication for the GCE adapter, and nothing else.
#
# GCE has no static-credential scheme: the app must self-sign a JWT with the service account's RSA
# key and exchange it for a short-lived access token. RS256 means PKCS#8/PEM parsing plus RSA
# PKCS#1 v1.5 signing over SHA-256.
#
# Deliberately *not* an async Google SDK (`google-cloud-*`): those are async-only, and every
# command runs on the blocking pool — driving one from there reintroduces the "cannot drop a
# runtime" panic described above. Signing is pure computation and composes with the blocking client.
#
# Hand-rolling over `rsa`/`sha2`/`pkcs8` was the alternative, rejected on the same grounds as
# hand-rolled SigV4: a signing mistake surfaces only as an opaque `invalid_grant`, and it would
# still add three crates instead of one. Pinned to 9.x, which respects this crate's MSRV and signs
# through `ring` 0.17 — already in the tree via `reqwest`'s rustls, so no second crypto backend.
jsonwebtoken = "9.3"

# QR encoding for device peer configs. A QR is the only import path the official WireGuard mobile
# apps offer, so this is what makes a phone able to use a provisioned server at all.
#
# Pure Rust, no C dependencies, and default features are off because only the module matrix is
# wanted — no image backend, no font, no PNG writer. Alternatives considered: the npm qrcode
# package (rejected — a runtime dependency on a deliberately four-dependency frontend, for logic
# that has to exist on this side anyway), and hand-rolling (rejected — Reed-Solomon ECC, version
# selection and mask evaluation are intricate enough that a subtly wrong encoder produces a code
# that scans on one phone and fails on another).
qrcode = { version = "0.14", default-features = false }
# Native Windows notifications while the window is hidden in the tray: a dropped tunnel, a server
# that is ready, a key that stopped working. Official Tauri plugin, maintained with Tauri itself.
# The alternative, driving WinRT toasts through a raw crate, means owning the registration and
# app-id plumbing this plugin already does. Desktop toasts here carry no action buttons; the action
# is one click away in the tray.
tauri-plugin-notification = "~2.4"

[dev-dependencies]
mockito = "1"
